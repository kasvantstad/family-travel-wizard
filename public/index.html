<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Family Travel Readiness Wizard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f7f6f2;
      --surface: #ffffff;
      --surface2: #f1f0ec;
      --border: rgba(0,0,0,0.1);
      --border-strong: rgba(0,0,0,0.18);
      --text: #1a1a18;
      --text-2: #5a5a54;
      --text-3: #9a9a94;
      --green: #1D9E75;
      --green-light: #E1F5EE;
      --green-dark: #0F6E56;
      --green-text: #085041;
      --amber: #EF9F27;
      --amber-light: #FAEEDA;
      --amber-text: #633806;
      --red: #E24B4A;
      --red-light: #FCEBEB;
      --red-text: #A32D2D;
      --radius: 12px;
      --radius-sm: 8px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem 4rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }
    header .eyebrow {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--green);
      margin-bottom: 8px;
    }
    header h1 {
      font-size: 26px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.2;
    }
    header p {
      font-size: 15px;
      color: var(--text-2);
      margin-top: 6px;
    }

    .wizard {
      width: 100%;
      max-width: 580px;
    }

    /* Progress */
    .progress-wrap { margin-bottom: 1.75rem; }
    .progress-bar { display: flex; align-items: center; }
    .step-dot {
      width: 30px; height: 30px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 600; flex-shrink: 0;
      transition: all 0.2s;
    }
    .step-dot.done { background: var(--green); color: white; }
    .step-dot.active { background: var(--text); color: white; }
    .step-dot.upcoming { background: var(--surface2); color: var(--text-3); border: 1px solid var(--border); }
    .step-line { flex: 1; height: 1px; background: var(--border); }
    .step-line.done { background: var(--green); }
    .progress-label {
      font-size: 12px; color: var(--text-2); margin-top: 8px;
    }

    /* Card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.75rem;
    }
    .card-title { font-size: 19px; font-weight: 600; margin-bottom: 4px; }
    .card-sub { font-size: 14px; color: var(--text-2); margin-bottom: 1.5rem; line-height: 1.5; }

    /* Fields */
    .field { margin-bottom: 1.1rem; }
    label.lbl { display: block; font-size: 13px; font-weight: 500; color: var(--text-2); margin-bottom: 6px; }
    input[type=text], select {
      width: 100%; padding: 9px 12px;
      border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
      font-family: inherit; font-size: 14px; color: var(--text);
      background: var(--surface); outline: none;
      transition: border-color 0.15s;
    }
    input[type=text]:focus, select:focus { border-color: var(--green); }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    /* Children */
    .age-list { display: flex; flex-direction: column; gap: 8px; }
    .age-row {
      display: flex; align-items: center; gap: 10px;
      background: var(--surface2); border-radius: var(--radius-sm); padding: 10px 14px;
    }
    .age-row .child-label { font-size: 13px; color: var(--text-2); flex: 1; }
    .age-val { font-size: 15px; font-weight: 600; min-width: 48px; text-align: center; }
    .age-btn {
      width: 30px; height: 30px; border-radius: 50%;
      border: 1px solid var(--border-strong); background: var(--surface);
      cursor: pointer; font-size: 18px; line-height: 1;
      display: flex; align-items: center; justify-content: center;
      color: var(--text); transition: background 0.1s;
    }
    .age-btn:hover { background: var(--surface2); }
    .del-btn {
      width: 26px; height: 26px; border-radius: 50%;
      border: 1px solid var(--border); background: none;
      cursor: pointer; font-size: 14px; color: var(--text-3);
      display: flex; align-items: center; justify-content: center;
      margin-left: auto;
    }
    .del-btn:hover { color: var(--red); border-color: var(--red); }
    .add-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 9px 14px; margin-top: 10px;
      border: 1px dashed var(--border-strong); border-radius: var(--radius-sm);
      background: none; cursor: pointer; color: var(--text-2);
      font-size: 13px; font-family: inherit;
      transition: all 0.15s;
    }
    .add-btn:hover { background: var(--surface2); color: var(--text); }

    /* Chips */
    .chip-group { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 7px 14px; border-radius: 20px;
      border: 1px solid var(--border-strong); font-size: 13px;
      cursor: pointer; background: var(--surface); color: var(--text);
      transition: all 0.15s; user-select: none;
    }
    .chip:hover { background: var(--surface2); }
    .chip.selected { background: var(--text); color: white; border-color: var(--text); }

    /* Nav */
    .nav { display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem; }
    .btn-back {
      background: none; border: 1px solid var(--border-strong);
      padding: 9px 18px; border-radius: var(--radius-sm);
      cursor: pointer; font-size: 14px; color: var(--text-2);
      font-family: inherit; transition: all 0.15s;
    }
    .btn-back:hover { background: var(--surface2); }
    .btn-next {
      background: var(--text); border: none; padding: 9px 22px;
      border-radius: var(--radius-sm); cursor: pointer;
      font-size: 14px; color: white; font-family: inherit;
      font-weight: 500; transition: opacity 0.15s;
      display: flex; align-items: center; gap: 6px;
    }
    .btn-next:hover { opacity: 0.82; }
    .btn-next:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-generate {
      background: var(--green); border: none; padding: 9px 22px;
      border-radius: var(--radius-sm); cursor: pointer;
      font-size: 14px; color: white; font-family: inherit;
      font-weight: 500; transition: background 0.15s;
      display: flex; align-items: center; gap: 7px;
    }
    .btn-generate:hover { background: var(--green-dark); }
    .btn-generate:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Report */
    .report-section { margin-bottom: 1rem; }
    .section-card {
      background: var(--surface2); border-radius: var(--radius-sm);
      padding: 1rem 1.25rem;
    }
    .section-eyebrow {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.07em; color: var(--text-3); margin-bottom: 10px;
    }
    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 10px; border-radius: 12px;
      font-size: 12px; font-weight: 600;
    }
    .badge-green { background: var(--green-light); color: var(--green-text); }
    .badge-amber { background: var(--amber-light); color: var(--amber-text); }
    .badge-red { background: var(--red-light); color: var(--red-text); }
    .score-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .score-num { font-size: 26px; font-weight: 600; }
    .pip-row { display: flex; gap: 3px; margin-bottom: 8px; }
    .pip { width: 20px; height: 6px; border-radius: 3px; background: var(--border); }
    .pip.g { background: var(--green); }
    .pip.a { background: var(--amber); }
    .pip.r { background: var(--red); }
    .verdict-text {
      font-size: 14px; color: var(--text-2); font-style: italic;
      padding: 10px 0 12px; border-bottom: 1px solid var(--border);
      margin-bottom: 12px; line-height: 1.6;
    }
    .row-item {
      display: flex; justify-content: space-between; align-items: flex-start;
      padding: 7px 0; border-bottom: 1px solid var(--border);
      font-size: 13px; gap: 12px;
    }
    .row-item:last-child { border-bottom: none; }
    .row-key { color: var(--text-2); flex-shrink: 0; }
    .row-val { color: var(--text); text-align: right; }
    .concern-block { padding: 9px 0; border-bottom: 1px solid var(--border); }
    .concern-block:last-child { border-bottom: none; }
    .concern-name { font-size: 13px; font-weight: 500; margin-bottom: 2px; }
    .concern-verdict { font-size: 13px; color: var(--text-2); }
    .concern-action { font-size: 12px; color: var(--green-dark); margin-top: 3px; }
    .tip-list { list-style: none; display: flex; flex-direction: column; gap: 5px; }
    .tip-list li { font-size: 13px; color: var(--text); padding-left: 14px; position: relative; line-height: 1.5; }
    .tip-list li::before { content: "—"; position: absolute; left: 0; color: var(--text-3); }
    .two-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .loading-row {
      display: flex; align-items: center; gap: 12px;
      padding: 1.5rem 0; color: var(--text-2); font-size: 14px;
    }
    .dots { display: flex; gap: 4px; }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--green);
      animation: blink 1.2s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink {
      0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1); }
    }
    .error-box {
      background: var(--red-light); color: var(--red-text);
      border-radius: var(--radius-sm); padding: 12px 16px;
      font-size: 13px; line-height: 1.5; margin-top: 1rem;
    }

    @media (max-width: 480px) {
      .two-col, .two-cards { grid-template-columns: 1fr; }
      header h1 { font-size: 22px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="eyebrow">✈ Trip planner</div>
    <h1>Family Travel Readiness</h1>
    <p>A personalised health, safety & planning report for your family trip.</p>
  </header>

  <div class="wizard">
    <div id="progress-area"></div>
    <div id="panel-area"></div>
  </div>

  <script>
    const STEPS = ["Destination", "Children", "Timing", "Travel style", "Concerns"];
    const REGIONS = ["Sub-Saharan Africa","North Africa","South & Southeast Asia","East Asia","Central America","South America","Caribbean","Middle East","Other"];
    const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    const STYLES = ["Luxury / resorts","Budget / backpacker","Adventure / outdoors","Wildlife & nature","Cultural immersion","Beach & relaxation","City breaks","Road trip"];
    const CONCERNS = ["Vaccinations & health","Malaria risk","Food & water safety","Medical facilities","Safety & crime","Child-friendly activities","Flight length","Visa requirements","Travel insurance","Language barriers"];

    const state = {
      step: 0,
      destination: "",
      region: "",
      children: [{ age: 4 }],
      month: "",
      duration: "",
      style: [],
      concerns: []
    };

    function render() {
      renderProgress();
      const area = document.getElementById("panel-area");
      area.innerHTML = "";
      [step0, step1, step2, step3, step4, step5][state.step](area);
    }

    function renderProgress() {
      const area = document.getElementById("progress-area");
      if (state.step >= 5) { area.innerHTML = ""; return; }
      area.innerHTML = "";
      const bar = document.createElement("div");
      bar.className = "progress-bar";
      for (let i = 0; i < 5; i++) {
        const d = document.createElement("div");
        d.className = "step-dot " + (i < state.step ? "done" : i === state.step ? "active" : "upcoming");
        d.textContent = i < state.step ? "✓" : i + 1;
        bar.appendChild(d);
        if (i < 4) {
          const l = document.createElement("div");
          l.className = "step-line" + (i < state.step ? " done" : "");
          bar.appendChild(l);
        }
      }
      const wrap = document.createElement("div");
      wrap.className = "progress-wrap";
      wrap.appendChild(bar);
      const lbl = document.createElement("div");
      lbl.className = "progress-label";
      lbl.textContent = `Step ${state.step + 1} of 5 — ${STEPS[state.step]}`;
      wrap.appendChild(lbl);
      area.appendChild(wrap);
    }

    function card(title, sub) {
      const c = document.createElement("div");
      c.className = "card";
      c.innerHTML = `<div class="card-title">${title}</div><div class="card-sub">${sub}</div>`;
      return c;
    }

    function nav(c, backFn, nextEl) {
      const n = document.createElement("div");
      n.className = "nav";
      if (backFn) {
        const b = document.createElement("button");
        b.className = "btn-back";
        b.textContent = "Back";
        b.onclick = backFn;
        n.appendChild(b);
      } else {
        n.appendChild(document.createElement("div"));
      }
      n.appendChild(nextEl);
      c.appendChild(n);
    }

    function step0(area) {
      const c = card("Where are you heading?", "Tell us your destination so we can tailor the report to the right region.");
      c.innerHTML += `
        <div class="field"><label class="lbl">City or country</label>
          <input type="text" id="dest" placeholder="e.g. Cape Town, South Africa" value="${state.destination}" /></div>
        <div class="field"><label class="lbl">Region</label>
          <select id="region">
            <option value="">Select a region…</option>
            ${REGIONS.map(r => `<option value="${r}" ${state.region === r ? "selected" : ""}>${r}</option>`).join("")}
          </select></div>`;
      const btn = document.createElement("button");
      btn.className = "btn-next";
      btn.innerHTML = "Continue →";
      btn.onclick = () => {
        state.destination = document.getElementById("dest").value.trim();
        state.region = document.getElementById("region").value;
        if (!state.destination || !state.region) return;
        state.step = 1; render();
      };
      nav(c, null, btn);
      area.appendChild(c);
    }

    function step1(area) {
      const c = card("Children travelling with you", "Add each child and set their age. Age affects vaccination advice, activities, and risk levels.");

      const listWrap = document.createElement("div");
      c.appendChild(listWrap);

      function renderKids() {
        listWrap.innerHTML = "";
        const list = document.createElement("div");
        list.className = "age-list";
        state.children.forEach((ch, i) => {
          const row = document.createElement("div");
          row.className = "age-row";
          row.innerHTML = `
            <span class="child-label">Child ${i + 1}</span>
            <button class="age-btn" data-a="dec" data-i="${i}">−</button>
            <span class="age-val">${ch.age} yr${ch.age !== 1 ? "s" : ""}</span>
            <button class="age-btn" data-a="inc" data-i="${i}">+</button>
            ${state.children.length > 1 ? `<button class="del-btn" data-a="del" data-i="${i}">✕</button>` : ""}`;
          list.appendChild(row);
        });
        list.querySelectorAll("[data-a]").forEach(btn => {
          btn.onclick = () => {
            const i = +btn.dataset.i;
            if (btn.dataset.a === "inc") state.children[i].age = Math.min(17, state.children[i].age + 1);
            if (btn.dataset.a === "dec") state.children[i].age = Math.max(0, state.children[i].age - 1);
            if (btn.dataset.a === "del") state.children.splice(i, 1);
            renderKids();
          };
        });
        const addBtn = document.createElement("button");
        addBtn.className = "add-btn";
        addBtn.innerHTML = "+ Add another child";
        addBtn.onclick = () => { state.children.push({ age: 4 }); renderKids(); };
        listWrap.appendChild(list);
        listWrap.appendChild(addBtn);
      }
      renderKids();

      const btn = document.createElement("button");
      btn.className = "btn-next";
      btn.innerHTML = "Continue →";
      btn.onclick = () => { state.step = 2; render(); };
      nav(c, () => { state.step = 0; render(); }, btn);
      area.appendChild(c);
    }

    function step2(area) {
      const c = card("When are you going?", "Travel timing affects weather windows, seasonal health risks, and what's open.");
      c.innerHTML += `
        <div class="two-col">
          <div class="field"><label class="lbl">Month of travel</label>
            <select id="month">
              <option value="">Select…</option>
              ${MONTHS.map(m => `<option value="${m}" ${state.month === m ? "selected" : ""}>${m}</option>`).join("")}
            </select></div>
          <div class="field"><label class="lbl">Trip duration</label>
            <select id="dur">
              <option value="">Select…</option>
              ${["3–5 days","1 week","10 days","2 weeks","3 weeks","1 month+"].map(d => `<option value="${d}" ${state.duration === d ? "selected" : ""}>${d}</option>`).join("")}
            </select></div>
        </div>`;
      const btn = document.createElement("button");
      btn.className = "btn-next";
      btn.innerHTML = "Continue →";
      btn.onclick = () => {
        state.month = document.getElementById("month").value;
        state.duration = document.getElementById("dur").value;
        if (!state.month || !state.duration) return;
        state.step = 3; render();
      };
      nav(c, () => { state.step = 1; render(); }, btn);
      area.appendChild(c);
    }

    function step3(area) {
      const c = card("What's your travel style?", "Pick all that apply — we'll match recommendations to how your family likes to travel.");
      const chipWrap = document.createElement("div");
      chipWrap.className = "chip-group";
      STYLES.forEach(s => {
        const ch = document.createElement("div");
        ch.className = "chip" + (state.style.includes(s) ? " selected" : "");
        ch.textContent = s;
        ch.onclick = () => {
          if (state.style.includes(s)) state.style = state.style.filter(x => x !== s);
          else state.style.push(s);
          ch.classList.toggle("selected", state.style.includes(s));
          btn.disabled = !state.style.length;
        };
        chipWrap.appendChild(ch);
      });
      c.appendChild(chipWrap);
      const btn = document.createElement("button");
      btn.className = "btn-next";
      btn.innerHTML = "Continue →";
      btn.disabled = !state.style.length;
      nav(c, () => { state.step = 2; render(); }, btn);
      area.appendChild(c);
    }

    function step4(area) {
      const c = card("What are your main concerns?", "Select everything on your mind — the report addresses each one directly.");
      const chipWrap = document.createElement("div");
      chipWrap.className = "chip-group";
      CONCERNS.forEach(con => {
        const ch = document.createElement("div");
        ch.className = "chip" + (state.concerns.includes(con) ? " selected" : "");
        ch.textContent = con;
        ch.onclick = () => {
          if (state.concerns.includes(con)) state.concerns = state.concerns.filter(x => x !== con);
          else state.concerns.push(con);
          ch.classList.toggle("selected", state.concerns.includes(con));
          genBtn.disabled = !state.concerns.length;
        };
        chipWrap.appendChild(ch);
      });
      c.appendChild(chipWrap);
      const genBtn = document.createElement("button");
      genBtn.className = "btn-generate";
      genBtn.innerHTML = "✦ Generate report";
      genBtn.disabled = !state.concerns.length;
      genBtn.onclick = () => { state.step = 5; render(); generateReport(); };
      nav(c, () => { state.step = 3; render(); }, genBtn);
      area.appendChild(c);
    }

    function step5(area) {
      const c = document.createElement("div");
      c.className = "card";
      c.innerHTML = `
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:1.25rem;">
          <div>
            <div class="card-title" style="margin-bottom:3px">Family Travel Readiness Report</div>
            <div style="font-size:13px;color:var(--text-2)">${state.destination} &middot; ${state.month} &middot; ${state.duration}</div>
          </div>
        </div>
        <div id="report-body">
          <div class="loading-row">
            <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
            Generating your report…
          </div>
        </div>
        <div class="nav" style="margin-top:1.5rem;border-top:1px solid var(--border);padding-top:1.25rem;">
          <button class="btn-back" id="restart">← Start over</button>
          <div></div>
        </div>`;
      document.getElementById("panel-area").appendChild(c);
      document.getElementById("restart").onclick = () => {
        Object.assign(state, { step:0, destination:"", region:"", children:[{age:4}], month:"", duration:"", style:[], concerns:[] });
        render();
      };
    }

    async function generateReport() {
      const childDesc = state.children.map((c, i) => `Child ${i+1}: ${c.age} year${c.age !== 1 ? "s" : ""} old`).join(", ");
      const prompt = `You are a family travel health and safety expert. Generate a Family Travel Readiness Report as a JSON object.

Trip details:
- Destination: ${state.destination} (${state.region})
- Children: ${childDesc}
- Travel month: ${state.month}
- Duration: ${state.duration}
- Travel style: ${state.style.join(", ")}
- Parent concerns: ${state.concerns.join(", ")}

Return ONLY valid JSON, no markdown, no backticks, no explanation. Use this exact structure:
{
  "overall_readiness": { "score": <1-10 integer>, "rating": <"Ready"|"Mostly Ready"|"Plan Carefully"|"Needs Preparation">, "summary": "<2 sentences>" },
  "destination_overview": { "family_friendliness": <1-10>, "climate_in_month": "<string>", "recommended_age_range": "<string>", "highlights": ["<up to 3 child-friendly highlights>"] },
  "health_checklist": [{ "item": "<string>", "priority": <"essential"|"recommended"|"optional">, "notes": "<brief>" }],
  "safety_assessment": { "overall": <"low"|"moderate"|"high">, "notes": "<2 sentences>", "child_specific_tips": ["<2-3 tips>"] },
  "concerns_addressed": [{ "concern": "<string>", "verdict": "<string>", "action": "<string>" }],
  "packing_essentials": ["<5-7 items>"],
  "best_activities": ["<3-5 age-appropriate activities>"],
  "quick_verdict": "<one punchy sentence>"
}`;

      try {
        const res = await fetch("/api/report", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Server error");
        const clean = data.text.replace(/```json|```/g, "").trim();
        const report = JSON.parse(clean);
        renderReport(report);
      } catch (err) {
        document.getElementById("report-body").innerHTML = `<div class="error-box"><strong>Something went wrong.</strong> ${err.message}</div>`;
      }
    }

    function renderReport(r) {
      const sc = r.overall_readiness.score;
      const col = sc >= 7 ? "g" : sc >= 5 ? "a" : "r";
      const badgeCls = col === "g" ? "badge-green" : col === "a" ? "badge-amber" : "badge-red";
      const safeCls = r.safety_assessment.overall === "low" ? "badge-green" : r.safety_assessment.overall === "moderate" ? "badge-amber" : "badge-red";
      const pips = Array.from({length:10}, (_,i) => `<div class="pip ${i < sc ? col : ''}"></div>`).join("");

      document.getElementById("report-body").innerHTML = `
        <div class="report-section">
          <div class="section-card">
            <div class="section-eyebrow">Overall readiness</div>
            <div class="score-row">
              <span class="score-num">${sc}/10</span>
              <span class="badge ${badgeCls}">${r.overall_readiness.rating}</span>
            </div>
            <div class="pip-row">${pips}</div>
            <p style="font-size:13px;color:var(--text-2);line-height:1.6">${r.overall_readiness.summary}</p>
          </div>
        </div>

        <div class="verdict-text">"${r.quick_verdict}"</div>

        <div class="report-section">
          <div class="section-card">
            <div class="section-eyebrow">Destination overview</div>
            <div class="row-item"><span class="row-key">Family friendliness</span><span class="row-val">${r.destination_overview.family_friendliness}/10</span></div>
            <div class="row-item"><span class="row-key">Climate in ${state.month}</span><span class="row-val">${r.destination_overview.climate_in_month}</span></div>
            <div class="row-item"><span class="row-key">Best for ages</span><span class="row-val">${r.destination_overview.recommended_age_range}</span></div>
            ${r.destination_overview.highlights.map(h => `<div class="row-item"><span class="row-key" style="color:var(--green)">★</span><span class="row-val" style="text-align:left">${h}</span></div>`).join("")}
          </div>
        </div>

        <div class="report-section">
          <div class="section-card">
            <div class="section-eyebrow">Health checklist</div>
            ${r.health_checklist.map(h => {
              const hc = h.priority === "essential" ? "badge-red" : h.priority === "recommended" ? "badge-amber" : "badge-green";
              return `<div class="row-item">
                <span class="row-key" style="flex:1;text-align:left">${h.item}<br><span style="font-size:12px;color:var(--text-3);font-weight:400">${h.notes}</span></span>
                <span class="badge ${hc}" style="flex-shrink:0;margin-left:10px">${h.priority}</span>
              </div>`;
            }).join("")}
          </div>
        </div>

        <div class="report-section">
          <div class="section-card">
            <div class="section-eyebrow">Safety assessment</div>
            <div style="margin-bottom:8px"><span class="badge ${safeCls}">Risk level: ${r.safety_assessment.overall}</span></div>
            <p style="font-size:13px;color:var(--text-2);line-height:1.6;margin-bottom:10px">${r.safety_assessment.notes}</p>
            <ul class="tip-list">${r.safety_assessment.child_specific_tips.map(t => `<li>${t}</li>`).join("")}</ul>
          </div>
        </div>

        <div class="report-section">
          <div class="section-card">
            <div class="section-eyebrow">Your concerns answered</div>
            ${r.concerns_addressed.map(c => `
              <div class="concern-block">
                <div class="concern-name">${c.concern}</div>
                <div class="concern-verdict">${c.verdict}</div>
                <div class="concern-action">→ ${c.action}</div>
              </div>`).join("")}
          </div>
        </div>

        <div class="two-cards report-section">
          <div class="section-card">
            <div class="section-eyebrow">Best activities</div>
            <ul class="tip-list">${r.best_activities.map(a => `<li>${a}</li>`).join("")}</ul>
          </div>
          <div class="section-card">
            <div class="section-eyebrow">Pack these</div>
            <ul class="tip-list">${r.packing_essentials.map(p => `<li>${p}</li>`).join("")}</ul>
          </div>
        </div>
      `;
    }

    render();
  </script>
</body>
</html>
